{% extends 'users/base.html' %}

{% block title %}Nueva cámara | IRIS{% endblock %}

{% block content %}
<div class="cam-add-main">
    <div class="form-container">
        <h2>Agregar Nueva Cámara</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar Cámara</button>
        </form>
        <a href="{% url 'home' %}">⬅ Volver a la lista</a>
    </div>
</div>
{% endblock %}
