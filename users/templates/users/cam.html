{% extends 'users/base.html' %}

{% block title %}{{ camara.nombre }} | IRIS{% endblock %}

{% block content %}
<div class="cam">
    <div class="video">
        <div>
            <h2>Stream de {{ camara.nombre }}</h2>
            <div class="cam-cont">
                <img src="{% url 'video_feed' camara.id %}" alt="Stream de {{ camara.nombre }}">
            </div>
        </div>
    </div>

    <div class="settings">
        <form method="post">
            {% csrf_token %}
            <label>Nombre:</label>
            {{ form.nombre }}

            <label>IP:</label>
            {{ form.ip }}

            <label>Intervalo de Captura (s):</label>
            {{ form.intervalo_captura }}

            <label>Certeza Mínima (0.0 - 1.0):</label>
            {{ form.certeza_minima }}

            <button type="submit">Guardar</button>
        </form>

        <textarea readonly>{% for alerta in alertas %}{{ alerta.fecha_deteccion }} - {{ alerta.tipo_deteccion }}
{% endfor %}</textarea>
    </div>
</div>

<a href="{% url 'home' %}" class="cam-add" id="back">←</a>
<a href="{% url 'ver_alertas' camara.id %}" class="cam-add">🖼️</a>
{% endblock %}
